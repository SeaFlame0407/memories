<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>揪本團活動紀錄</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI",sans-serif;
            background:
                linear-gradient(rgba(4,8,20,.75), rgba(4,8,20,.92)),
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            color:#f5f7ff;
            min-height:100vh;
        }

        .navbar{
            width:100%;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            backdrop-filter: blur(10px);
            background:rgba(0,0,0,.25);
            position:sticky;
            top:0;
        }

        .logo{
            font-size:28px;
            font-weight:700;
            letter-spacing:2px;
        }

        .logo span{
            color:#7dd3fc;
        }

        .nav-links{
            display:flex;
            gap:24px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            opacity:.85;
            transition:.2s;
        }

        .nav-links a:hover{
            opacity:1;
            color:#7dd3fc;
        }

        .hero{
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            min-height:85vh;
            padding:40px;
        }

        .hero-content{
            max-width:900px;
            animation:fadeIn 1.2s ease;
        }

        .hero h1{
            font-size:72px;
            margin-bottom:18px;
            text-shadow:0 0 18px rgba(125,211,252,.35);
        }

        .hero p{
            font-size:20px;
            line-height:1.8;
            color:#dbeafe;
            margin-bottom:40px;
        }

        .btn-group{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .btn{
            padding:14px 28px;
            border-radius:999px;
            text-decoration:none;
            font-weight:600;
            transition:.25s;
        }

        .btn-primary{
            background:#38bdf8;
            color:#02131f;
        }

        .btn-primary:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 30px rgba(56,189,248,.4);
        }

        .btn-secondary{
            border:1px solid rgba(255,255,255,.3);
            color:white;
            background:rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover{
            background:rgba(255,255,255,.15);
        }

        .section{
            padding:90px 8%;
        }

        .section-title{
            text-align:center;
            font-size:42px;
            margin-bottom:50px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:24px;
        }

        .card{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.08);
            border-radius:24px;
            padding:30px;
            backdrop-filter: blur(12px);
            transition:.25s;
        }

        .card:hover{
            transform:translateY(-6px);
            background:rgba(255,255,255,.12);
        }

        .card h3{
            margin-bottom:14px;
            font-size:24px;
            color:#7dd3fc;
        }

        .card p{
            line-height:1.7;
            color:#d6e2ff;
        }

        footer{
            text-align:center;
            padding:40px;
            color:#b6c3df;
            font-size:14px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px){

            .hero h1{
                font-size:48px;
            }

            .hero p{
                font-size:18px;
            }

            .navbar{
                flex-direction:column;
                gap:16px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
        </div>

        <div class="nav-links">
            <a href="#">首頁</a>
            <a href="#">活動紀錄</a>
            <a href="#">成員</a>
            <a href="#">相簿</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">

            <h1></h1>

            <p>
                記錄我們在艾歐澤亞的深夜、歡笑、滅團、
                漁師發病、89語錄，以及那些再也回不去的版本時光。
            </p>

            <div class="btn-group">
                <a href="#" class="btn btn-primary">進入回憶</a>
                <a href="#" class="btn btn-secondary">查看截圖</a>
            </div>

        </div>
    </section>

    <section class="section">

        <h2 class="section-title">冒險紀錄</h2>

        <div class="cards">

            <div class="card">
                <h3>📖 Raid Night</h3>
                <p>
                    每週固定發病、滅團、有人忘記爆發、
                    還有補師說自己沒魔的故事。
                </p>
            </div>

            <div class="card">
                <h3>🎣 漁師日誌</h3>
                <p>
                    半夜三點還在蹲大魚，
                    被天氣系統與時間窗折磨的悲慘人生。
                </p>
            </div>

            <div class="card">
                <h3>📸 精華截圖</h3>
                <p>
                    包含各種迷因、站街、跑圖、
                    還有不知道為什麼開始拍偶像劇的時刻。
                </p>
            </div>

        </div>

    </section>

    <footer>
        
    </footer>

</body>
</html>
